[project]
name = "investos"
version = "0.1.0"
description = "Personal investment intelligence for research, portfolio context, verification, and simulation without real trading"
authors = [{ name = "Eric Wang" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "investos"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = "^0.162.2"
uvicorn = "^0.54.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.1.8"}
alembic = "^1.20.1"
asyncpg = "^0.32.0"
pydantic = {extras = ["email"], version = "^2.14.3"}
pydantic-settings = "^2.16.2"
httpx = "^0.28.1"
apscheduler = "^3.11.3"
python-multipart = "^0.0.33"
greenlet = "^3.5.6"
plaid-python = "^39.0.0"
youtube-transcript-api = "^1.2.5"
fastjsonschema = "^2.22.3"
pywebpush = "^2.5.0"
exchange-calendars = "^4.13.2"
feedparser = "^6.0.14"
pypdfium2 = "^5.15.2"
pillow = "^13.0.0"
python-docx = "^1.2.0"
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
black = "^26.5.1"
isort = "^5.13.2"
flake8 = "^7.4.1"
bandit = "^1.9.4"
pip-audit = "^2.10.0"
coverage = "^7.16.1"
reportlab = "^5.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
