<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Prophet is offline</title>
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #09090b; color: #f1f5f9; }
      main { width: min(32rem, calc(100% - 2rem)); border: 1px solid #272b35; background: #0f1115; padding: 2rem; }
      h1 { margin: 0; font-size: 1.5rem; }
      p { margin: 1rem 0 0; color: #94a3b8; line-height: 1.6; }
      button { margin-top: 1.5rem; border: 1px solid #3f4654; background: #f1f5f9; color: #0f172a; padding: 0.7rem 1rem; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Prophet is offline</h1>
      <p>
        Live portfolio, research, and automation state is unavailable. Prophet does not cache sensitive workspace data for offline use.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
